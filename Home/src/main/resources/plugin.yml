name: Home
version: '${version}'
main: fr.zyumie.home.Home
api-version: '1.21'
author: Zyumie
depend: [Main]

commands:
  sethome:
    description: Définit un home à ta position actuelle
    usage: /sethome [nom]
    permission: home.command.sethome
  home:
    description: Te téléporte à un home ou ouvre le menu GUI (/home list)
    usage: /home [nom|list]
    permission: home.command.home
  delhome:
    description: Supprime un de tes homes
    usage: /delhome [nom]
    permission: home.command.delhome

permissions:
  home.max.1:
    description: Autorise 1 home maximum
    default: true
  home.max.2:
    description: Autorise 2 homes maximum
    default: op
  home.max.3:
    description: Autorise 3 homes maximum
    default: op
  home.max.4:
    description: Autorise 4 homes maximum
    default: op
  home.max.5:
    description: Autorise 5 homes maximum
    default: op