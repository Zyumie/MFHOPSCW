# =========================================
#   Home - Configuration
# =========================================

home:
  # Cooldown (en secondes) pendant lequel /home et /tpa sont bloqués après une mort
  death-cooldown-seconds: 300

messages:
  prefix: "<dark_gray>[<aqua>Home<dark_gray>] <gray>"
  set-success: "<green>Home défini !"
  set-requires-death: "<red>Tu dois mourir au moins une fois avant de pouvoir définir un home."
  del-success: "<green>Home supprimé."
  del-none: "<red>Tu n'as pas de home défini."
  tp-success: "<green>Téléportation au home..."
  tp-none: "<red>Aucun home défini. Utilise /sethome après ta prochaine mort."
  tp-cooldown: "<red>Tu dois attendre <yellow>{remaining}s <red>avant de pouvoir te téléporter (après ta mort)."
  no-permission: "<red>Tu n'as pas la permission."
