# =========================================
#   Profil - Configuration du GUI
#   (utilisé si config.yml -> display.mode: gui)
# =========================================

title: "<dark_gray>Profil de <aqua>{player}"
rows: 3   # 1 à 6

# Remplissage des slots non utilisés. "material: NONE" pour désactiver.
filler:
  material: GRAY_STAINED_GLASS_PANE
  name: " "

# Placeholders disponibles dans name/lore : {player} {status} {money} {faction} {bank}
#
# Layout par défaut (3 lignes, tête au centre) :
#   .  .  .  .  .  .  .  .  .
#   .  .  MONEY  .  HEAD  .  FACTION  .  .
#   .  .  .  .  BANK  .  .  .  .
items:

  head:
    slot: 13
    type: HEAD              # tête (skin) du joueur affiché — le material n'est pas utilisé pour ce type
    name: "<aqua><bold>{player}"
    lore:
      - ""
      - "{status}"

  money:
    slot: 11
    type: MONEY
    material: GOLD_INGOT
    name: "<gray>Argent"
    lore:
      - "<white>{money}"

  faction:
    slot: 15
    type: FACTION
    material: WHITE_BANNER
    name: "<gray>Faction"
    lore:
      - "<white>{faction}"

  faction-bank:
    slot: 22
    type: FACTION_BANK
    material: CHEST
    name: "<gray>Banque de faction"
    lore:
      - "<white>{bank}"
