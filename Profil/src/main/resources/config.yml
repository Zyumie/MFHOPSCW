# =========================================
#   Profil - Configuration
# =========================================

display:
  # Mode d'affichage de /profile : "chat" (texte dans le chat) ou "gui" (inventaire, voir gui.yml)
  # Si "gui" est choisi mais que l'expéditeur n'est pas un joueur (ex: console), on retombe sur "chat".
  mode: chat

messages:
  # --- Mode chat ---
  header: "<dark_gray>┌───────────────────────"
  spacer: "<dark_gray>│"
  footer: "<dark_gray>└───────────────────────"
  name-line-prefix: "<dark_gray>│ "
  name-format: "<aqua><bold>"
  separator: "<dark_gray> — "
  line-prefix: "<dark_gray>│ <gray>"
  money-label: "💰 Argent        : "
  faction-label: "⚔ Faction       : "
  bank-label: "🏦 Bank faction : "
  value-color: "<white>"
  value-fallback-color: "<gray>"
  usage: "<red>Usage: /profile <joueur>"
  player-not-found: "<red>Joueur introuvable : "
  no-permission: "<red>Tu n'as pas la permission."
  reload-success: "<green>Configuration Profil rechargée (config.yml + gui.yml)."

  # --- Communs chat + gui ---
  status-online: "En ligne"
  status-offline: "Hors ligne"
  no-economy: "Aucun plugin économie"
  no-faction-module: "Module faction inactif"
  no-faction: "Aucune"
  no-faction-bank: "N/A"
  no-faction-selected: "Aucune faction"
