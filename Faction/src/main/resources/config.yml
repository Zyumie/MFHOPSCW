# =========================================
#   Faction - Configuration
# =========================================

faction:
  # Longueur max du nom d'une faction
  max-name-length: 16
  # Nombre max de membres par faction (0 = illimité)
  max-members: 0

  # Cooldown global entre les commandes /f (en secondes)
  cooldown-seconds: 5
  # Délai avant d'être téléporté au /f home (en secondes)
  teleport-delay-seconds: 10

# Grades disponibles, dans l'ordre hiérarchique (Chef en premier = rang le plus haut).
# "permissions" liste ce que ce grade peut faire.
# Valeurs possibles: invite, kick, promote, demote, deposit, withdraw, delete, pvp, sethome
grades:
  CHEF:
    display: "Chef"
    color: "<red>"
    permissions: [invite, kick, promote, demote, deposit, withdraw, delete, pvp, sethome]
  BRAS_DROIT:
    display: "Bras-Droit"
    color: "<gold>"
    permissions: [invite, kick, promote, demote, deposit, withdraw, pvp, sethome]
  MODO:
    display: "Modo"
    color: "<yellow>"
    permissions: [invite, kick, deposit]
  MEMBRE:
    display: "Membre"
    color: "<green>"
    permissions: [deposit]
  INVITE:
    display: "Invité"
    color: "<gray>"
    permissions: []

messages:
  prefix: "<dark_gray>[<gold>Faction<dark_gray>] <gray>"
  no-permission: "<red>Tu n'as pas la permission d'effectuer cette action."
  not-in-faction: "<red>Tu n'es dans aucune faction."
  already-in-faction: "<red>Tu es déjà dans une faction."
  faction-not-found: "<red>Faction introuvable: <yellow>{name}"
  player-not-found: "<red>Joueur introuvable: <yellow>{name}"
  player-not-in-faction: "<red>Ce joueur n'est pas dans ta faction."

  create-success: "<green>Faction <yellow>{name} <green>créée avec succès !"
  create-already-exists: "<red>Une faction nommée <yellow>{name} <red>existe déjà."
  create-name-invalid: "<red>Nom invalide. Max {max} caractères, pas d'espaces."

  delete-success: "<green>Faction <yellow>{name} <green>dissoute."
  delete-confirm: "<red>Tu es sur le point de dissoudre ta faction. Retape la commande dans les 10s pour confirmer."

  invite-sent: "<green>Invitation envoyée à <yellow>{player}<green>."
  invite-received: "<green>La faction <yellow>{faction} <green>t'a invité ! Tape <aqua>/f join {faction} <green>pour rejoindre."
  invite-none: "<red>Aucune invitation en attente de cette faction."

  join-success: "<green>Tu as rejoint la faction <yellow>{faction}<green> !"
  join-broadcast: "<yellow>{player} <green>a rejoint la faction !"

  leave-success: "<green>Tu as quitté la faction <yellow>{faction}<green>."
  leave-chef: "<red>Tu es le chef. Transfère d'abord ton grade via /f promote, ou dissous la faction avec /f delete."
  leave-broadcast: "<yellow>{player} <green>a quitté la faction."

  kick-success: "<yellow>{player} <green>a été exclu de la faction."
  kick-broadcast: "<yellow>{player} <green>a été exclu par <yellow>{by}<green>."
  kick-self: "<red>Tu ne peux pas t'exclure toi-même."
  kick-outranks: "<red>Tu ne me peux pas exclure quelqu'un de rang supérieur ou égal."

  promote-success: "<yellow>{player} <green>a été promu <gold>{grade}<green>."
  promote-max: "<yellow>{player} <green>est déjà au grade maximum."
  promote-outranks: "<red>Tu ne peux pas promouvoir quelqu'un à ton rang ou au-dessus."
  demote-success: "<yellow>{player} <green>a été rétrogradé à <gold>{grade}<green>."
  demote-min: "<yellow>{player} <green>est déjà au grade minimum."

  bank-header: "<dark_gray>─── <gold>Bank de {faction} <dark_gray>───"
  bank-balance: "<gray>Solde: <yellow>{amount}"
  deposit-success: "<green>Tu as déposé <yellow>{amount} <green>dans la bank."
  deposit-insufficient: "<red>Solde personnel insuffisant."
  withdraw-success: "<green>Tu as retiré <yellow>{amount} <green>de la bank."
  withdraw-insufficient: "<red>Solde de la bank insuffisant."

  pvp-success: "<green>Le PvP interne de la faction a été {status}."
  pvp-broadcast: "<yellow>{player} a {status} le PvP de la faction."

  sethome-success: "<green>Le home de la faction a été défini avec succès !"
  sethome-broadcast: "<yellow>{player} a mis à jour le home de la faction."
  home-not-set: "<red>Votre faction n'a pas encore défini de home."
  home-invalid: "<red>Le monde où se situe le home de la faction est introuvable."
  home-teleport-success: "<green>Téléportation au home de la faction effectuée !"
  teleport-start: "<yellow>Téléportation dans {seconds} seconde(s)... Ne bougez pas !"
  teleport-cancelled: "<red>Téléportation annulée car vous avez bougé ou pris des dégâts."
  cooldown-active: "<red>Veuillez attendre {seconds} seconde(s) avant de réutiliser une commande de faction."