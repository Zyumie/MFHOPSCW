# =========================================
#   HDV - Configuration Principale
# =========================================

hdv:
  # Taxe prélevée sur chaque vente réussie (%)
  tax-percent: 5.0
  # Nombre max d'annonces actives par joueur
  max-listings-per-player: 10
  # Durée max d'une annonce (en heures)
  max-duration-hours: 168
  # Durée par défaut si non spécifiée (en heures)
  default-duration-hours: 48
  # Prix minimum d'une annonce
  min-price: 1.0
  # Prix maximum d'une annonce
  max-price: 999999999.0
  # Frais de mise en vente (fixe, prélevé à la création de l'annonce)
  listing-fee: 10.0
  # Délai avant expiration après notification (en minutes)
  expired-claim-delay-minutes: 1440

messages:
  prefix: "<dark_gray>[<dark_purple>HDV<dark_gray>] <gray>"
  listing-created: "<green>Annonce créée ! <yellow>{item} <green>pour <yellow>{price} <green>({duration}h)"
  listing-fee-charged: "<gray>Frais de mise en vente: <red>-{fee}"
  listing-sold: "<green>Votre annonce a été vendue ! <yellow>{item} <green>pour <yellow>{price}<green>. (taxe: <red>{tax}<green>)"
  listing-expired: "<red>Votre annonce pour <yellow>{item} <red>a expiré. Récupérez vos items avec /hdv claim."
  buy-success: "<green>Achat effectué: <yellow>{item} <green>pour <yellow>{price}<green>."
  buy-fail-funds: "<red>Solde insuffisant. Il te faut <yellow>{price}<red>."
  no-listings: "<gray>Aucune annonce disponible."
  not-your-listing: "<red>Cette annonce ne t'appartient pas."
  listing-not-found: "<red>Annonce introuvable."
  max-listings: "<red>Tu as atteint ta limite d'annonces (<yellow>{max}<red>)."
  inventory-full: "<red>Ton inventaire est plein. Libère de la place et réessaie."
  invalid-price: "<red>Prix invalide. Min: <yellow>{min}<red>, Max: <yellow>{max}<red>."
  claim-success: "<green>Items récupérés !"
  claim-nothing: "<gray>Aucun item à récupérer."
  listing-cancelled: "<green>Annonce annulée. Tes items ont été restitués."
  no-permission: "<red>Tu n'as pas la permission."
