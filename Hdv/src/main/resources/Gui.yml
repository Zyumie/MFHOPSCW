# =========================================
#   HDV - Configuration du GUI
# =========================================
# custom-model-data: référence aux textures de ton resource pack.
# Mettre 0 pour désactiver et utiliser l'item vanilla.

main-gui:
  title: "<dark_purple><bold>✦ Hôtel des Ventes"
  rows: 6

  fill:
    enabled: true # Mettre 'false' pour enlever le remplissage
    material: PURPLE_STAINED_GLASS_PANE
    name: " "
    custom-model-data: 0

  # Barre de filtres (rangée 0)
  filter-bar:
    row: 0
    all-items:
      slot: 0
      material: NETHER_STAR
      name: "<white>✦ Toutes les annonces"
      lore:
        - "<gray>Afficher toutes les annonces"
      custom-model-data: 1001
    my-listings:
      slot: 1
      material: CHEST
      name: "<yellow>⬡ Mes annonces"
      lore:
        - "<gray>Voir et gérer tes annonces"
      custom-model-data: 1002
    sell-item:
      slot: 2
      material: GOLD_INGOT
      name: "<gold>✚ Mettre en vente"
      lore:
        - "<gray>Mettre un item en vente"
        - "<gray>Tiens l'item dans ta main principale"
        - "<gray>et clique ici."
      custom-model-data: 1003
    claim:
      slot: 3
      material: ENDER_CHEST
      name: "<green>⬇ Récupérer mes items"
      lore:
        - "<gray>Récupérer les items des annonces"
        - "<gray>expirées ou annulées."
      custom-model-data: 1004

  # Zone annonces (rangées 1 à 4 = slots 9 à 44)
  listings-area:
    start-slot: 9
    end-slot: 44

  # Navigation (rangée 5)
  navigation:
    prev-page:
      slot: 45
      material: ARROW
      name: "<gray>◀ Page précédente"
      lore:
        - "<gray>Aller à la page précédente"
      custom-model-data: 1010
    page-indicator:
      slot: 49
      material: MAP
      name: "<gray>Page <yellow>{page}<gray>/<yellow>{max}"
      lore:
        - "<gray>Navigation entre les pages"
      custom-model-data: 1011
    next-page:
      slot: 53
      material: ARROW
      name: "<gray>Page suivante ▶"
      lore:
        - "<gray>Aller à la page suivante"
      custom-model-data: 1012
    close:
      slot: 47
      material: BARRIER
      name: "<red>✖ Fermer"
      lore: []
      custom-model-data: 0

  # Apparence d'une annonce dans le GUI
  listing-item:
    lore-append:
      - ""
      - "<gray>Vendeur: <yellow>{seller}"
      - "<gray>Prix: <yellow>{price}"
      - "<gray>Expire dans: <yellow>{expires}"
      - ""
      - "<green>Clique gauche <gray>pour acheter"
      - "<yellow>Clique droit <gray>pour annuler (si ta liste)"

# GUI de confirmation d'achat
confirm-gui:
  title: "<dark_purple><bold>Confirmer l'achat"
  rows: 3
  fill:
    enabled: true # Mettre 'false' pour enlever le remplissage
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    custom-model-data: 0
  confirm:
    slot: 11
    material: LIME_STAINED_GLASS_PANE
    name: "<green>✔ Confirmer l'achat"
    lore:
      - "<gray>Item: <white>{item}"
      - "<gray>Prix: <yellow>{price}"
      - "<gray>Taxe incluse dans le prix vendeur"
      - ""
      - "<green>Cliquer pour confirmer"
    custom-model-data: 1020
  cancel:
    slot: 15
    material: RED_STAINED_GLASS_PANE
    name: "<red>✖ Annuler"
    lore:
      - "<gray>Retour à la liste"
    custom-model-data: 1021
  item-display-slot: 13

# GUI de création d'annonce
create-gui:
  title: "<dark_purple><bold>Mise en vente"
  rows: 3
  fill:
    enabled: true # Mettre 'false' pour enlever le remplissage
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    custom-model-data: 0
  item-slot: 13
  duration-decrease:
    slot: 9
    material: RED_STAINED_GLASS_PANE
    name: "<red>- <gray>1h"
    custom-model-data: 0
  duration-display:
    slot: 10
    material: CLOCK
    name: "<gray>Durée: <yellow>{duration}h"
    lore:
      - "<gray>Clique sur + ou - pour ajuster"
    custom-model-data: 0
  duration-increase:
    slot: 11
    material: LIME_STAINED_GLASS_PANE
    name: "<green>+ <gray>1h"
    custom-model-data: 0
  price-decrease:
    slot: 18
    material: RED_STAINED_GLASS_PANE
    name: "<red>- <gray>Prix"
    lore:
      - "<yellow>Clique gauche <gray>-1"
      - "<yellow>Shift+clic <gray>-100"
    custom-model-data: 0
  price-display:
    slot: 19
    material: SUNFLOWER
    name: "<gray>Prix: <yellow>{price}"
    lore:
      - "<gray>Clique sur + ou - pour ajuster"
    custom-model-data: 1030
  price-increase:
    slot: 20
    material: LIME_STAINED_GLASS_PANE
    name: "<green>+ <gray>Prix"
    lore:
      - "<yellow>Clique gauche <gray>+1"
      - "<yellow>Shift+clic <gray>+100"
    custom-model-data: 0
  confirm:
    slot: 24
    material: LIME_STAINED_GLASS_PANE
    name: "<green>✔ Mettre en vente"
    lore:
      - "<gray>Item: <white>{item}"
      - "<gray>Prix: <yellow>{price}"
      - "<gray>Durée: <yellow>{duration}h"
      - "<gray>Frais de création: <red>{fee}"
      - ""
      - "<green>Cliquer pour confirmer"
    custom-model-data: 1020
  cancel:
    slot: 22
    material: BARRIER
    name: "<red>✖ Annuler"
    custom-model-data: 0