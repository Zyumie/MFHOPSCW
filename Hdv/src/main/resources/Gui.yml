# =========================================
#   HDV - Configuration du GUI
# =========================================
# custom-model-data: référence aux textures de ton resource pack.
# Mettre 0 pour désactiver et utiliser l'item vanilla.
# Exemple: 1001 = texture "hdv_fill", 1002 = texture "hdv_button_prev", etc.

main-gui:
  title: "&5&l✦ Hôtel des Ventes"
  rows: 6

  fill:
    enabled: true
    material: PURPLE_STAINED_GLASS_PANE
    name: " "
    custom-model-data: 0

  # Barre de filtres (rangée 0)
  filter-bar:
    row: 0
    all-items:
      slot: 0
      material: NETHER_STAR
      name: "&f✦ Toutes les annonces"
      lore:
        - "&7Afficher toutes les annonces"
      custom-model-data: 1001
    my-listings:
      slot: 1
      material: CHEST
      name: "&e⬡ Mes annonces"
      lore:
        - "&7Voir et gérer tes annonces"
      custom-model-data: 1002
    sell-item:
      slot: 2
      material: GOLD_INGOT
      name: "&6✚ Mettre en vente"
      lore:
        - "&7Mettre un item en vente"
        - "&7Tiens l'item dans ta main principale"
        - "&7et clique ici."
      custom-model-data: 1003
    claim:
      slot: 3
      material: ENDER_CHEST
      name: "&a⬇ Récupérer mes items"
      lore:
        - "&7Récupérer les items des annonces"
        - "&7expirées ou annulées."
      custom-model-data: 1004

  # Zone annonces (rangées 1 à 4 = slots 9 à 44)
  listings-area:
    start-slot: 9
    end-slot: 44

  # Navigation (rangée 5)
  navigation:
    prev-page:
      slot: 45
      material: ARROW
      name: "&7◀ Page précédente"
      lore:
        - "&7Aller à la page précédente"
      custom-model-data: 1010
    page-indicator:
      slot: 49
      material: MAP
      name: "&7Page &e{page}&7/&e{max}"
      lore:
        - "&7Navigation entre les pages"
      custom-model-data: 1011
    next-page:
      slot: 53
      material: ARROW
      name: "&7Page suivante ▶"
      lore:
        - "&7Aller à la page suivante"
      custom-model-data: 1012
    close:
      slot: 47
      material: BARRIER
      name: "&c✖ Fermer"
      lore: []
      custom-model-data: 0

  # Apparence d'une annonce dans le GUI
  listing-item:
    # Lore ajouté dynamiquement sous le lore original de l'item
    lore-append:
      - ""
      - "&7Vendeur: &e{seller}"
      - "&7Prix: &e{price}"
      - "&7Expire dans: &e{expires}"
      - ""
      - "&aClique gauche &7pour acheter"
      - "&eClique droit &7pour annuler (si ta liste)"

# GUI de confirmation d'achat
confirm-gui:
  title: "&5&lConfirmer l'achat"
  rows: 3
  fill:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    custom-model-data: 0
  confirm:
    slot: 11
    material: LIME_STAINED_GLASS_PANE
    name: "&a✔ Confirmer l'achat"
    lore:
      - "&7Item: &f{item}"
      - "&7Prix: &e{price}"
      - "&7Taxe incluse dans le prix vendeur"
      - ""
      - "&aCliquer pour confirmer"
    custom-model-data: 1020
  cancel:
    slot: 15
    material: RED_STAINED_GLASS_PANE
    name: "&c✖ Annuler"
    lore:
      - "&7Retour à la liste"
    custom-model-data: 1021
  item-display-slot: 13

# GUI de création d'annonce
create-gui:
  title: "&5&lMise en vente"
  rows: 3
  fill:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    custom-model-data: 0
  item-slot: 13
  duration-decrease:
    slot: 9
    material: RED_STAINED_GLASS_PANE
    name: "&c- &71h"
    custom-model-data: 0
  duration-display:
    slot: 10
    material: CLOCK
    name: "&7Durée: &e{duration}h"
    lore:
      - "&7Clique sur + ou - pour ajuster"
    custom-model-data: 0
  duration-increase:
    slot: 11
    material: LIME_STAINED_GLASS_PANE
    name: "&a+ &71h"
    custom-model-data: 0
  price-decrease:
    slot: 18
    material: RED_STAINED_GLASS_PANE
    name: "&c- &7Prix"
    lore:
      - "&eClique gauche &7-1"
      - "&eShift+clic &7-100"
    custom-model-data: 0
  price-display:
    slot: 19
    material: SUNFLOWER
    name: "&7Prix: &e{price}"
    lore:
      - "&7Clique sur + ou - pour ajuster"
    custom-model-data: 1030
  price-increase:
    slot: 20
    material: LIME_STAINED_GLASS_PANE
    name: "&a+ &7Prix"
    lore:
      - "&eClique gauche &7+1"
      - "&eShift+clic &7+100"
    custom-model-data: 0
  confirm:
    slot: 24
    material: LIME_STAINED_GLASS_PANE
    name: "&a✔ Mettre en vente"
    lore:
      - "&7Item: &f{item}"
      - "&7Prix: &e{price}"
      - "&7Durée: &e{duration}h"
      - "&7Frais de création: &c{fee}"
      - ""
      - "&aCliquer pour confirmer"
    custom-model-data: 1020
  cancel:
    slot: 22
    material: BARRIER
    name: "&c✖ Annuler"
    custom-model-data: 0
