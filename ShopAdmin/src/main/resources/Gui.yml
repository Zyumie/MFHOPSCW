# =========================================
#   ShopAdmin - Configuration du GUI
# =========================================

main-gui:
  title: "&6&lBoutique Admin"
  rows: 6  # 1-6

  # Item de remplissage (fond du GUI)
  fill:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE
    name: " "
    border:
      enabled: true
      material: BLACK_STAINED_GLASS_PANE

  # Barre de catégories (rangée 0 = première rangée)
  category-bar:
    row: 0
    # Slots de 0 à 8 disponibles dans cette rangée
    # Les catégories du Shop.yml seront placées dans l'ordre

  # Zone d'affichage des items (slots 9 à 44 = rangées 1 à 4)
  items-area:
    start-slot: 9
    end-slot: 44
    # Nombre d'items par page (max = end-slot - start-slot + 1)

  # Barre de navigation (rangée 5 = dernière rangée)
  navigation:
    prev-page:
      slot: 45
      material: ARROW
      name: "&7← Page précédente"
      lore:
        - "&7Cliquer pour aller à la page précédente"
    close:
      slot: 49
      material: BARRIER
      name: "&cFermer"
      lore:
        - "&7Cliquer pour fermer"
    next-page:
      slot: 53
      material: ARROW
      name: "&7Page suivante →"
      lore:
        - "&7Cliquer pour aller à la page suivante"

  # Indicateur de page
  page-indicator:
    slot: 48
    material: BOOK
    name: "&7Page &e{page}&7/&e{max}"
    lore:
      - "&7Navigation entre les pages"

  # Sélecteur de quantité (ouvert au Shift+clic)
  quantity-selector:
    title: "&8Sélectionner une quantité"
    rows: 3
    fill:
      enabled: true
      material: BLACK_STAINED_GLASS_PANE
      name: " "
    confirm-buy:
      material: LIME_STAINED_GLASS_PANE
      name: "&aAcheter x{amount}"
      lore:
        - "&7Coût total: &e{total_price}"
        - ""
        - "&aCliquer pour confirmer"
    confirm-sell:
      material: ORANGE_STAINED_GLASS_PANE
      name: "&6Vendre x{amount}"
      lore:
        - "&7Revenu total: &e{total_price}"
        - ""
        - "&6Cliquer pour confirmer"
    cancel:
      slot: 22
      material: BARRIER
      name: "&cAnnuler"
