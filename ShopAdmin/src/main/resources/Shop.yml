# =========================================
#   ShopAdmin - Configuration des Items
# =========================================
# Chaque catégorie a un id unique, un nom affiché, une icône et une liste d'items.
# buy-price: prix pour acheter 1 unité (-1 = achat désactivé)
# sell-price: prix pour vendre 1 unité (-1 = vente désactivée)
# stock: stock disponible (-1 = illimité)
# slot: ordre d'affichage de l'item dans sa catégorie (0 = premier affiché, 1 = second, ...).
#   Ce n'est PAS un numéro de slot d'inventaire littéral : la position réelle dans le GUI
#   dépend de main-gui.items-area (Gui.yml), qui peut changer indépendamment de ce nombre.
# custom-model-data: optionnel, pour les resource packs
# trim: optionnel, pour ajouté de la variété
#   | Motifs : COAST, DUNE, EYE, RIB, SENTRY, SHAPER, SILENCE, SNOUT, SPIRE, TIDE, VEX, WARD, WAYFINDER, RAISER, SHAPER, HOST
#   | Matériaux : QUARTZ, IRON, NETHERITE, REDSTONE, COPPER, GOLD, EMERALD, DIAMOND, LAPIS, AMETHYST
#
# IMPORTANT :
# ShopAdmin doit gérer "custom-item-id".
# Pour les armures, l'icône affichée est un plastron,
# mais l'achat doit donner le vrai set complet via CustomItems.
#
# IDs CustomItems :
# storm_armor
# ghost_armor
# rescue_armor
# soul_armor
# celestial_sword
# explosive_bow
# ender_bow
# berserk_sword
#

