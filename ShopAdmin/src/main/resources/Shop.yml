# =========================================
#   ShopAdmin - Configuration des Items
# =========================================
# Chaque catégorie a un id unique, un nom affiché, une icône et une liste d'items.
# buy-price: prix pour acheter 1 unité (-1 = achat désactivé)
# sell-price: prix pour vendre 1 unité (-1 = vente désactivée)
# stock: stock disponible (-1 = illimité)
# slot: position dans le GUI de catégorie (0-based dans la zone items, définie dans Gui.yml)
# custom-model-data: optionnel, pour les resource packs
#
# IMPORTANT :
# ShopAdmin doit gérer "custom-item-id".
# Pour les armures, l'icône affichée est un plastron,
# mais l'achat doit donner le vrai set complet via CustomItems.
#
# IDs CustomItems :
# storm_armor
# ghost_armor
# rescue_armor
# soul_armor
# celestial_sword
# explosive_bow
# ender_bow
# berserk_sword
#

