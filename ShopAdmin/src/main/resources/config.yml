# =========================================
#   ShopAdmin - Configuration Principale
# =========================================

shop:
  # Quantités disponibles lors de l'achat/vente (Shift+clic ouvre un sélecteur)
  buy-amounts: [1, 8, 16, 32, 64]
  sell-amounts: [1, 8, 16, 32, 64]
  # Autoriser la vente d'items enchantés ?
  allow-enchanted-sell: false
  # Autoriser la vente d'items endommagés ?
  allow-damaged-sell: false

messages:
  prefix: "<dark_gray>[<gold>Shop<dark_gray>] <gray>"
  buy-success: "<green>Achat effectué: <yellow>x{amount} {item} <green>pour <yellow>{price}"
  sell-success: "<green>Vente effectuée: <yellow>x{amount} {item} <green>pour <yellow>{price}"
  insufficient-funds: "<red>Solde insuffisant. Il te faut <yellow>{price}<red>."
  insufficient-stock: "<red>Stock insuffisant. Stock actuel: <yellow>{stock}<red>."
  inventory-full: "<red>Ton inventaire est plein."
  not-enough-items: "<red>Tu n'as pas assez de <yellow>{item}<red> dans ton inventaire."
  sell-disabled: "<red>Cet item ne peut pas être vendu."
  no-permission: "<red>Tu n'as pas la permission."
  reload-success: "<green>Shop rechargé avec succès."
  no-economy: "<red>La boutique est indisponible pour le moment (économie non détectée)."
  duplicate-purchase: "<red>Trop rapide ! Réessaie dans un instant."
  shop-closed: "<red>La boutique est fermée pour le moment."
