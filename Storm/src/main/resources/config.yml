# =========================================
#   Storm - Configuration de la Tempête
# =========================================

# Mondes affectés par la tempête (noms exacts des mondes du serveur)
worlds:
  - world

# ── Cycle hebdomadaire ────────────────────────────────────────────────
cycle:
  # Durées possibles pour les tempêtes aléatoires de la semaine (m = minutes, h = heures, d = jours)
  possible-durations: ["30m", "1h", "2h", "6h", "12h", "1d", "2d"]
  # Heure de déclenchement (format 24h: "HH:mm")
  trigger-time: "20:00"
  # Fuseau horaire
  timezone: "Europe/Paris"

# ── Effets environnementaux ───────────────────────────────────────────
environment:
  # Verrouiller le temps en nuit éternelle pendant la tempête
  eternal-night: true
  # Heure du monde pendant la tempête (18000 = minuit)
  night-time: 18000
  # Activer l'orage (pluie + éclairs)
  thunderstorm: true

# ── Effets sur les joueurs exposés ───────────────────────────────────
exposure:
  # Intervalle de vérification des joueurs (en ticks, 20 = 1 seconde)
  check-interval-ticks: 20
  # Intervalle entre chaque infligement de dégâts (en ticks)
  damage-interval-ticks: 40
  # Dégâts infligés à chaque intervalle (en demi-cœurs)
  damage-amount: 2.0
  # Amplificateur de Nausée (0 = niveau 1)
  nausea-amplifier: 0
  # Amplificateur de Lenteur (0 = niveau 1, 2 = niveau 3)
  slowness-amplifier: 2
  # Amplificateur de Wither (0 = niveau 1, -1 = désactivé)
  wither-amplifier: -1
  # Cécité (true/false)
  blindness: true
  # Durée des effets de potion (en ticks, doit être > check-interval)
  effect-duration-ticks: 60
  # Ignorer les joueurs en mode créatif / spectateur
  ignore-creative: true
  # Ignorer les joueurs avec la permission storm.bypass
  use-bypass-permission: true

# ── Sbires & éclairs ─────────────────────────────────────────────────
hazards:
  # Frapper les joueurs exposés avec des éclairs ?
  lightning-strikes: true
  # Probabilité d'éclair par joueur par vérification (0.0 à 1.0)
  lightning-chance: 0.05

# ── Messages ──────────────────────────────────────────────────────────
messages:
  prefix: "<dark_gray>[<blue>⛈ Tempête<dark_gray>] <gray>"
  storm-start:
    - "<blue><bold>⛈ UNE TEMPÊTE APOCALYPTIQUE COMMENCE ⛈"
    - "<gray>Durée: <yellow>{duration} jour(s) <gray>| Fin prévue: <yellow>{end-date}"
    - "<red>Rentrez à l'abri immédiatement !"
  storm-end:
    - "<green><bold>☀ LA TEMPÊTE EST PASSÉE ☀"
    - "<gray>Le soleil renaît. Le monde reprend son souffle."
  surface-warning: "<red>⚠ Tu es exposé à la tempête ! Mets-toi à l'abri !"
  surface-warning-interval-ticks: 100  # Intervalle d'affichage du warning (ticks)
  scheduled: "<gray>Prochaine tempête programmée: <yellow>{start-date} <gray>({duration} jour(s))"
  no-storm: "<gray>Aucune tempête prévue cette semaine."
  storm-active: "<red>Tempête en cours <gray>— Fin: <yellow>{end-date}"
  admin-start: "<green>Tempête démarrée manuellement."
  admin-stop: "<green>Tempête arrêtée manuellement."
  admin-reload: "<green>Configuration rechargée."
  no-permission: "<red>Tu n'as pas la permission."
