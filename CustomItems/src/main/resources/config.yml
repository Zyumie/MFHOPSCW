# ─────────────────────────────────────────────────────────
#  ARMURES CUSTOM
# ─────────────────────────────────────────────────────────

armors:

  # ── Armure Anti-Tempête ──────────────────────────────────
  storm:
    enabled: true
    require-full-set: true
    display-name: "<blue><bold>Armure Anti-Tempête"
    lore:
      - "<gray>Forgée dans l'œil d'une tempête millénaire."
      - ""
      - "<blue>✦ Immunité totale à la tempête apocalyptique"
      - "<blue>✦ Effets et dégâts de tempête annulés"
      - ""
      - "<dark_gray>ID: storm_armor"
    # Trim appliqué à toutes les pièces du set (peut être surchargé par pièce)
    trim:
      enabled: true
      material: diamond   # minecraft:diamond
      pattern: bolt       # minecraft:bolt
    helmet:
      material: DIAMOND_HELMET
      custom-model-data: 2001
      color: null
      # trim optionnel par pièce — surcharge le trim global si défini
      # trim:
      #   enabled: true
      #   material: diamond
      #   pattern: bolt
    chestplate:
      material: DIAMOND_CHESTPLATE
      custom-model-data: 2002
      color: null
    leggings:
      material: DIAMOND_LEGGINGS
      custom-model-data: 2003
      color: null
    boots:
      material: DIAMOND_BOOTS
      custom-model-data: 2004
      color: null
    enchantments:
      PROTECTION_ENVIRONMENTAL: 4
      DURABILITY: 3
    messages:
      equipped:   "<blue>⛈ Armure anti-tempête enfilée. Tu es protégé."
      unequipped: "<gray>L'armure anti-tempête a été retirée."

  # ── Armure Fantôme ───────────────────────────────────────
  ghost:
    enabled: true
    require-full-set: true
    display-name: "<white><bold>Armure Fantôme"
    lore:
      - "<gray>L'âme de ceux qui voulaient disparaître..."
      - ""
      - "<white>✦ Invisibilité totale (armure + pseudo masqués)"
      - "<red>✦ Un seul coup brise l'invisibilité 5 secondes"
      - ""
      - "<dark_gray>ID: ghost_armor"
    trim:
      enabled: false      # Désactivé : le trim rendrait l'armure visible
      material: quartz
      pattern: silence
    helmet:
      material: LEATHER_HELMET
      custom-model-data: 2011
      color: "0x000000"
    chestplate:
      material: LEATHER_CHESTPLATE
      custom-model-data: 2012
      color: "0x000000"
    leggings:
      material: LEATHER_LEGGINGS
      custom-model-data: 2013
      color: "0x000000"
    boots:
      material: LEATHER_BOOTS
      custom-model-data: 2014
      color: "0x000000"
    enchantments:
      PROTECTION_ENVIRONMENTAL: 2
    reveal-duration-seconds: 5
    messages:
      invisible:  "<white>👻 Tu es invisible."
      revealed:   "<red>💥 Invisibilité brisée pendant <yellow>{duration}s<red> !"
      restored:   "<white>👻 Tu redeviens invisible."

  # ── Armure de Sauvetage ──────────────────────────────────
  rescue:
    enabled: true
    require-full-set: false
    display-name: "<green><bold>Armure de Sauvetage"
    lore:
      - "<gray>Conçue pour les situations désespérées."
      - ""
      - "<green>✦ Téléportation d'urgence à <yellow>1 cœur"
      - "<green>✦ Rayon aléatoire: <yellow>{radius} blocs"
      - "<gray>(Cooldown: <yellow>{cooldown}s<gray>)"
      - ""
      - "<dark_gray>ID: rescue_armor"
    trim:
      enabled: true
      material: emerald   # minecraft:emerald
      pattern: eye        # minecraft:eye
    helmet:
      material: IRON_HELMET
      custom-model-data: 2021
      color: null
    chestplate:
      material: IRON_CHESTPLATE
      custom-model-data: 2022
      color: null
    leggings:
      material: IRON_LEGGINGS
      custom-model-data: 2023
      color: null
    boots:
      material: IRON_BOOTS
      custom-model-data: 2024
      color: null
    enchantments:
      PROTECTION_ENVIRONMENTAL: 3
      DURABILITY: 2
    teleport-radius: 15
    trigger-health: 2.0
    cooldown-seconds: 30
    messages:
      triggered: "<green>⚡ Téléportation d'urgence ! Tu as été sauvé."
      cooldown:  "<red>Cooldown actif encore <yellow>{remaining}s<red>."

  # ── Armure Voleuse d'Âmes ────────────────────────────────
  soul:
    enabled: true
    require-full-set: true
    display-name: "<dark_purple><bold>Armure Voleuse d'Âmes"
    lore:
      - "<gray>Chaque mort nourrit ta puissance..."
      - ""
      - "<dark_purple>✦ +2 cœurs par kill (cumulable)"
      - "<red>✦ Perte totale si pièce retirée ou mort"
      - ""
      - "<dark_gray>ID: soul_armor"
    trim:
      enabled: true
      material: amethyst  # minecraft:amethyst
      pattern: ward       # minecraft:ward
    helmet:
      material: NETHERITE_HELMET
      custom-model-data: 2031
      color: null
    chestplate:
      material: NETHERITE_CHESTPLATE
      custom-model-data: 2032
      color: null
    leggings:
      material: NETHERITE_LEGGINGS
      custom-model-data: 2033
      color: null
    boots:
      material: NETHERITE_BOOTS
      custom-model-data: 2034
      color: null
    enchantments:
      PROTECTION_ENVIRONMENTAL: 4
      DURABILITY: 3
    hp-per-kill: 4.0
    max-bonus-hp: 0
    messages:
      kill-bonus:    "<dark_purple>+2 cœurs ! <dark_gray>[<dark_purple>{total}<dark_gray> bonus actif(s)]"
      reset-death:   "<dark_purple>💀 Âmes perdues à la mort."
      reset-unequip: "<dark_purple>💔 Âmes libérées en retirant l'armure."

# ─────────────────────────────────────────────────────────
#  ARMES CUSTOM
# ─────────────────────────────────────────────────────────

weapons:

  celestial-sword:
    enabled: true
    display-name: "<yellow><bold>✦ Épée Céleste"
    lore:
      - "<gray>Forgée par les dieux pour punir les impies."
      - ""
      - "<yellow>✦ Kill → Propulsion <yellow>30 blocs en hauteur"
      - "<yellow>✦ En chute → Masse céleste"
      - "<yellow>  ✗ Raté : 0 dégât de chute"
      - "<yellow>  ✓ Touché : One-shot + re-propulsion"
      - ""
      - "<dark_gray>ID: celestial_sword"
    material: DIAMOND_SWORD
    custom-model-data: 3001
    item-model: "celestialSword"
    enchantments:
      DAMAGE_ALL: 5
      DURABILITY: 3
      FIRE_ASPECT: 2
    launch-velocity: 2.5
    mace-material: MACE
    mace-display-name: "<yellow><bold>⚒ Masse Céleste"
    mace-lore:
      - "<gray>La puissance du ciel concentrée."
      - ""
      - "<yellow>✦ Touche un joueur → One-shot + re-propulsion"
      - "<yellow>✦ Rate → Aucun dégât de chute"
    mace-custom-model-data: 3002
    mace-item-model: "celestialMace"
    messages:
      launch:       "<yellow>⬆ Tu t'élèves vers les cieux !"
      mace-form:    "<yellow>⚒ La masse est prête. Frappe !"
      kill-slam:    "<yellow>💥 Impact céleste ! La cible est anéantie."
      miss-landing: "<yellow>✓ Atterrissage sans dégât."

  explosive-bow:
    enabled: true
    display-name: "<red><bold>💥 Arc Explosif"
    lore:
      - "<gray>L'artillerie du pauvre... mais efficace."
      - ""
      - "<red>✦ Touche un joueur → Explosion de zone (AoE)"
      - "<red>✦ Rayon: <yellow>{radius} <red>blocs"
      - ""
      - "<dark_gray>ID: explosive_bow"
    material: BOW
    custom-model-data: 3011
    item-model: "ExplosiveBow"
    enchantments:
      ARROW_DAMAGE: 3
      DURABILITY: 3
    explosion-radius: 4.0
    explosion-damage: 6.0
    real-explosion: false
    explosion-particle: EXPLOSION_LARGE
    messages:
      explosion: "<red>💥 Explosion ! <yellow>{hits} <red>cibles touchées."

  ender-bow:
    enabled: true
    display-name: "<light_purple><bold>🌀 Arc Ender"
    lore:
      - "<gray>La flèche qui dévore l'espace..."
      - ""
      - "<light_purple>✦ Touche un joueur → Téléportation derrière la cible"
      - ""
      - "<dark_gray>ID: ender_bow"
    material: BOW
    custom-model-data: 3021
    item-model: "EnderBow"
    enchantments:
      ARROW_DAMAGE: 2
      DURABILITY: 3
    teleport-offset: 2.0
    teleport-particle: PORTAL
    messages:
      teleported: "<light_purple>🌀 Téléporté derrière <yellow>{target}<light_purple> !"

  berserk-sword:
    enabled: true
    display-name: "<dark_red><bold>⚡ Épée Berserk"
    lore:
      - "<gray>La rage distillée en acier..."
      - ""
      - "<dark_red>✦ Clic-droit → Mode Berserk <yellow>10s"
      - "<gray>  ✦ Suppression du cooldown d'attaque (style 1.8)"
      - "<gray>  ✦ Buff pour les membres de faction à <yellow>10 blocs"
      - "<gray>(Cooldown: <yellow>5 minutes<gray>)"
      - ""
      - "<dark_gray>ID: berserk_sword"
    material: NETHERITE_SWORD
    custom-model-data: 3031
    item-model: "BerserkSword"
    enchantments:
      DAMAGE_ALL: 5
      DURABILITY: 3
      LOOTING: 3
    berserk-duration-seconds: 10
    cooldown-seconds: 300
    faction-buff-radius: 10.0
    attack-speed-value: 1024.0
    messages:
      activated:      "<dark_red>⚡ MODE BERSERK ! <yellow>{duration}s <dark_red>de fureur !"
      faction-buffed: "<dark_red>⚡ <yellow>{player} <dark_red>active le Berserk ! Tu es aussi en rage !"
      ended:          "<gray>Berserk terminé."
      cooldown:       "<red>Cooldown actif: <yellow>{remaining}s <red>restant(e)s."
      already-active: "<red>Vous êtes déjà en mode Berserk !"

