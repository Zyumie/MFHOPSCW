armors:

  # ── Armure Anti-Tempête ──────────────────────────────────
  storm:
    enabled: true
    require-full-set: true
    display-name: "&9&lArmure Anti-Tempête"
    lore:
      - "&7Forgée dans l'œil d'une tempête millénaire."
      - ""
      - "&9✦ Immunité totale à la tempête apocalyptique"
      - "&9✦ Effets et dégâts de tempête annulés"
      - ""
      - "&8ID: storm_armor"
    # Trim appliqué à toutes les pièces du set (peut être surchargé par pièce)
    trim:
      enabled: true
      material: diamond   # minecraft:diamond
      pattern: bolt       # minecraft:bolt
    helmet:
      material: DIAMOND_HELMET
      custom-model-data: 2001
      color: null
      # trim optionnel par pièce — surcharge le trim global si défini
      # trim:
      #   enabled: true
      #   material: diamond
      #   pattern: bolt
    chestplate:
      material: DIAMOND_CHESTPLATE
      custom-model-data: 2002
      color: null
    leggings:
      material: DIAMOND_LEGGINGS
      custom-model-data: 2003
      color: null
    boots:
      material: DIAMOND_BOOTS
      custom-model-data: 2004
      color: null
    enchantments:
      PROTECTION_ENVIRONMENTAL: 4
      DURABILITY: 3
    messages:
      equipped:   "&9⛈ Armure anti-tempête enfilée. Tu es protégé."
      unequipped: "&7L'armure anti-tempête a été retirée."

  # ── Armure Fantôme ───────────────────────────────────────
  ghost:
    enabled: true
    require-full-set: true
    display-name: "&f&lArmure Fantôme"
    lore:
      - "&7L'âme de ceux qui voulaient disparaître..."
      - ""
      - "&f✦ Invisibilité totale (armure + pseudo masqués)"
      - "&c✦ Un seul coup brise l'invisibilité 5 secondes"
      - ""
      - "&8ID: ghost_armor"
    trim:
      enabled: false      # Désactivé : le trim rendrait l'armure visible
      material: quartz
      pattern: silence
    helmet:
      material: LEATHER_HELMET
      custom-model-data: 2011
      color: "0x000000"
    chestplate:
      material: LEATHER_CHESTPLATE
      custom-model-data: 2012
      color: "0x000000"
    leggings:
      material: LEATHER_LEGGINGS
      custom-model-data: 2013
      color: "0x000000"
    boots:
      material: LEATHER_BOOTS
      custom-model-data: 2014
      color: "0x000000"
    enchantments:
      PROTECTION_ENVIRONMENTAL: 2
    reveal-duration-seconds: 5
    messages:
      invisible:  "&f👻 Tu es invisible."
      revealed:   "&c💥 Invisibilité brisée pendant &e{duration}s&c !"
      restored:   "&f👻 Tu redeviens invisible."

  # ── Armure de Sauvetage ──────────────────────────────────
  rescue:
    enabled: true
    require-full-set: false
    display-name: "&a&lArmure de Sauvetage"
    lore:
      - "&7Conçue pour les situations désespérées."
      - ""
      - "&a✦ Téléportation d'urgence à &e1 cœur"
      - "&a✦ Rayon aléatoire: &e{radius} blocs"
      - "&7(Cooldown: &e{cooldown}s&7)"
      - ""
      - "&8ID: rescue_armor"
    trim:
      enabled: true
      material: emerald   # minecraft:emerald
      pattern: eye        # minecraft:eye
    helmet:
      material: IRON_HELMET
      custom-model-data: 2021
      color: null
    chestplate:
      material: IRON_CHESTPLATE
      custom-model-data: 2022
      color: null
    leggings:
      material: IRON_LEGGINGS
      custom-model-data: 2023
      color: null
    boots:
      material: IRON_BOOTS
      custom-model-data: 2024
      color: null
    enchantments:
      PROTECTION_ENVIRONMENTAL: 3
      DURABILITY: 2
    teleport-radius: 15
    trigger-health: 2.0
    cooldown-seconds: 30
    messages:
      triggered: "&a⚡ Téléportation d'urgence ! Tu as été sauvé."
      cooldown:  "&cCooldown actif encore &e{remaining}s&c."

  # ── Armure Voleuse d'Âmes ────────────────────────────────
  soul:
    enabled: true
    require-full-set: true
    display-name: "&5&lArmure Voleuse d'Âmes"
    lore:
      - "&7Chaque mort nourrit ta puissance..."
      - ""
      - "&5✦ +2 cœurs par kill (cumulable)"
      - "&c✦ Perte totale si pièce retirée ou mort"
      - ""
      - "&8ID: soul_armor"
    trim:
      enabled: true
      material: amethyst  # minecraft:amethyst
      pattern: ward       # minecraft:ward
    helmet:
      material: NETHERITE_HELMET
      custom-model-data: 2031
      color: null
    chestplate:
      material: NETHERITE_CHESTPLATE
      custom-model-data: 2032
      color: null
    leggings:
      material: NETHERITE_LEGGINGS
      custom-model-data: 2033
      color: null
    boots:
      material: NETHERITE_BOOTS
      custom-model-data: 2034
      color: null
    enchantments:
      PROTECTION_ENVIRONMENTAL: 4
      DURABILITY: 3
    hp-per-kill: 4.0
    max-bonus-hp: 0
    messages:
      kill-bonus:    "&5+2 cœurs ! &8[&5{total}&8 bonus actif(s)]"
      reset-death:   "&5💀 Âmes perdues à la mort."
      reset-unequip: "&5💔 Âmes libérées en retirant l'armure."

