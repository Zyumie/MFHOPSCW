weapons:

  celestial-sword:
    enabled: true
    display-name: "&e&l✦ Épée Céleste"
    lore:
      - "&7Forgée par les dieux pour punir les impies."
      - ""
      - "&e✦ Kill → Propulsion &e30 blocs en hauteur"
      - "&e✦ En chute → Masse céleste"
      - "&e  ✗ Raté : 0 dégât de chute"
      - "&e  ✓ Touché : One-shot + re-propulsion"
      - ""
      - "&8ID: celestial_sword"
    material: DIAMOND_SWORD
    custom-model-data: 3001
    item-model: "celestialSword"
    enchantments:
      DAMAGE_ALL: 5
      DURABILITY: 3
      FIRE_ASPECT: 2
    launch-velocity: 2.5
    mace-material: MACE
    mace-display-name: "&e&l⚒ Masse Céleste"
    mace-lore:
      - "&7La puissance du ciel concentrée."
      - ""
      - "&e✦ Touche un joueur → One-shot + re-propulsion"
      - "&e✦ Rate → Aucun dégât de chute"
    mace-custom-model-data: 3002
    mace-item-model: "celestialMace"
    messages:
      launch:       "&e⬆ Tu t'élèves vers les cieux !"
      mace-form:    "&e⚒ La masse est prête. Frappe !"
      kill-slam:    "&e💥 Impact céleste ! La cible est anéantie."
      miss-landing: "&e✓ Atterrissage sans dégât."

  explosive-bow:
    enabled: true
    display-name: "&c&l💥 Arc Explosif"
    lore:
      - "&7L'artillerie du pauvre... mais efficace."
      - ""
      - "&c✦ Touche un joueur → Explosion de zone (AoE)"
      - "&c✦ Rayon: &e{radius} &cblocs"
      - ""
      - "&8ID: explosive_bow"
    material: BOW
    custom-model-data: 3011
    item-model: "ExplosiveBow"
    enchantments:
      ARROW_DAMAGE: 3
      DURABILITY: 3
    explosion-radius: 4.0
    explosion-damage: 6.0
    real-explosion: false
    explosion-particle: EXPLOSION_LARGE
    messages:
      explosion: "&c💥 Explosion ! &e{hits} &ccibles touchées."

  ender-bow:
    enabled: true
    display-name: "&d&l🌀 Arc Ender"
    lore:
      - "&7La flèche qui dévore l'espace..."
      - ""
      - "&d✦ Touche un joueur → Téléportation derrière la cible"
      - ""
      - "&8ID: ender_bow"
    material: BOW
    custom-model-data: 3021
    item-model: "EnderBow"
    enchantments:
      ARROW_DAMAGE: 2
      DURABILITY: 3
    teleport-offset: 2.0
    teleport-particle: PORTAL
    messages:
      teleported: "&d🌀 Téléporté derrière &e{target}&d !"

  berserk-sword:
    enabled: true
    display-name: "&4&l⚡ Épée Berserk"
    lore:
      - "&7La rage distillée en acier..."
      - ""
      - "&4✦ Clic-droit → Mode Berserk &e10s"
      - "&7  ✦ Suppression du cooldown d'attaque (style 1.8)"
      - "&7  ✦ Buff pour les membres de faction à &e10 blocs"
      - "&7(Cooldown: &e5 minutes&7)"
      - ""
      - "&8ID: berserk_sword"
    material: NETHERITE_SWORD
    custom-model-data: 3031
    item-model: "BerserkSword"
    enchantments:
      DAMAGE_ALL: 5
      DURABILITY: 3
      LOOTING: 3
    berserk-duration-seconds: 10
    cooldown-seconds: 300
    faction-buff-radius: 10.0
    attack-speed-value: 1024.0
    messages:
      activated:      "&4⚡ MODE BERSERK ! &e{duration}s &4de fureur !"
      faction-buffed: "&4⚡ &e{player} &4active le Berserk ! Tu es aussi en rage !"
      ended:          "&7Berserk terminé."
      cooldown:       "&cCooldown actif: &e{remaining}s &crestant(e)s."

